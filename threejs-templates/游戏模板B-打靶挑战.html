<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游戏模板B · 打靶挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #101024; font-family: "Microsoft YaHei", sans-serif; }
  #ui {
    position: fixed; top: 16px; left: 20px; color: #fff; font-size: 22px; font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,.6); user-select: none;
  }
  #ui span { color: #4ecdc4; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(10,10,25,.78); color: #fff; text-align: center;
  }
  #overlay h1 { font-size: 46px; letter-spacing: 4px; }
  #overlay p { font-size: 16px; color: #aab; line-height: 1.8; }
  #overlay button {
    font-size: 20px; padding: 10px 40px; border: none; border-radius: 999px;
    background: #4ecdc4; color: #123; cursor: pointer; margin-top: 10px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="ui">时间 <span id="time">30</span> ｜ 分数 <span id="score">0</span> ｜ 点击 <span id="shots">0</span></div>

<div id="overlay">
  <h1 id="title">打 靶 挑 战</h1>
  <p id="subtitle">30 秒内，点掉冒出来的彩色靶子<br/>点得越准，命中率越高</p>
  <button id="startBtn">开始游戏</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.js",
    "three/addons/": "./libs/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   改皮入口（改成你的游戏，先改这里）
   ============================================================ */
const SETTINGS = {
  游戏时长: 30,          // 秒
  靶子存活时间: 2.2,     // 秒，越小越难
  刷靶间隔: 0.8,         // 秒，越小越密
  靶子大小: 0.7,
  靶子颜色们: [0xff6b6b, 0x4ecdc4, 0xffd93d, 0xa78bfa, 0xff9f43],
};

/* ============【A 三件套】照抄不变 ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101024);
scene.fog = new THREE.Fog(0x101024, 20, 50);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8899bb, 1));
const key = new THREE.DirectionalLight(0xffffff, 2);
key.position.set(4, 8, 8);
scene.add(key);
scene.add(new THREE.GridHelper(40, 40, 0x2a3150, 0x1c2240));

/* ============【E 界面】记分牌 ============ */
const timeEl = document.getElementById('time');
const scoreEl = document.getElementById('score');
const shotsEl = document.getElementById('shots');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const startBtn = document.getElementById('startBtn');

let score = 0, shots = 0, timeLeft = SETTINGS.游戏时长;

function updateUI() {
  timeEl.textContent = Math.ceil(timeLeft);
  scoreEl.textContent = score;
  shotsEl.textContent = shots;
}

/* ============【C 物品生成】随机位置冒出靶子 ============ */
const targets = [];

function spawnTarget() {
  const color = SETTINGS.靶子颜色们[Math.floor(Math.random() * SETTINGS.靶子颜色们.length)];
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(SETTINGS.靶子大小, 24, 24),
    new THREE.MeshStandardMaterial({
      color, metalness: 0.3, roughness: 0.25,
      emissive: color, emissiveIntensity: 0.25,   // 自带一点微光，暗背景里看得清
    })
  );
  // 出生在镜头前的随机位置（x: -6~6，y: -3~4，z: -5~-2）
  mesh.position.set(
    (Math.random() - 0.5) * 12,
    -3 + Math.random() * 7,
    -5 + Math.random() * 3
  );
  mesh.scale.setScalar(0.01);                    // 从 0 长出来
  mesh.userData = { life: SETTINGS.靶子存活时间, born: 0 };
  scene.add(mesh);
  targets.push(mesh);
}

/* ============【B 玩家 + 输入】这次"玩家"是你的鼠标：Raycaster 激光笔 ============ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

addEventListener('pointerdown', (e) => {
  if (!playing) return;
  shots++;   // 点一次算一次出手（打没打中都算）

  // 屏幕坐标(像素) 换算成标准坐标(-1 ~ 1)——公式照抄
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;

  // 从相机朝鼠标方向射一条激光，先打到谁就是点中了谁
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(targets)[0];

  if (hit) {
    score++;
    scene.remove(hit.object);                 // 消失两件套
    targets.splice(targets.indexOf(hit.object), 1);
  }
  updateUI();
});

/* ============【F 游戏循环】 ============ */
let playing = false;
const clock = new THREE.Clock();
let spawnTimer = 0;

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (playing) {
    // 倒计时
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; updateUI(); endGame(); }

    // 定时刷靶
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTarget();
      spawnTimer = SETTINGS.刷靶间隔;
    }

    // 靶子：从 0 长到 1、存活倒计时、到点消失
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      t.userData.born = Math.min(1, t.userData.born + dt * 5);   // 长出来
      t.scale.setScalar(t.userData.born * (0.9 + Math.sin(performance.now() * 0.005) * 0.1)); // 轻微呼吸
      t.userData.life -= dt;

      if (t.userData.life <= 0) {
        scene.remove(t);      // 没点中，自己缩没了
        targets.splice(i, 1);
      }
    }
    updateUI();
  }

  renderer.render(scene, camera);
}
loop();

/* ============【开始 / 结束】 ============ */
startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  resetGame();
  playing = true;
});

function resetGame() {
  targets.forEach(t => scene.remove(t));
  targets.length = 0;
  score = 0;
  shots = 0;
  timeLeft = SETTINGS.游戏时长;
  spawnTimer = 0;
  updateUI();
}

function endGame() {
  playing = false;
  const acc = shots ? Math.round(score / shots * 100) : 0;   // 命中率
  titleEl.textContent = '时间到！';
  subtitleEl.innerHTML =
    `分数：<b style="color:#4ecdc4;font-size:26px;">${score}</b> ｜ 命中率：<b style="color:#4ecdc4;font-size:26px;">${acc}%</b><br/>想更难？把 SETTINGS 里的"靶子存活时间"调小试试`;
  startBtn.textContent = '再来一次';
  overlay.classList.remove('hidden');
}

/* ============【固定写法】 ============ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
